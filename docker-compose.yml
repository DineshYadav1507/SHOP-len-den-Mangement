services:
  shoplenden:
    image: ${SHOPLENDEN_IMAGE:-dineshyy/shoplenden:latest}
    container_name: shoplenden
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:${SHOPLENDEN_PORT:-3000}:3000"
    volumes:
      - shoplenden_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s

volumes:
  shoplenden_data:
    name: shoplenden_data
